on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shahidsha1612/medium-recent-articles@1c347646dfd5e7b636ace515d917e2156b286496 # v1
        with:
          username: itsrubenclarke
          count: "3"
          link_titles: "false"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update recent Medium articles"
          git push
