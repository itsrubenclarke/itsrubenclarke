name: Update Substack articles

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README from Substack feed
        env:
          SUBSTACK_FEED: https://itsrubenclarke.substack.com/feed
          MAX_POSTS: "3"
          LINK_TITLES: "false"
        run: python .github/scripts/update_substack.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update recent Substack articles"
            git push
          fi
