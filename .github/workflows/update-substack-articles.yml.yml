name: Update recent Substack articles

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README with latest Substack posts
        run: python .github/scripts/update_substack.py
        env:
          SUBSTACK_FEED: https://itsrubenclarke.substack.com/feed
          MAX_POSTS: "3"
          LINK_TITLES: "false"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update recent Substack articles" && git push)
